name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/gstraders/creditmanager app/src/main/res/values
          mv root-build.gradle.kts build.gradle.kts
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.kt app/src/main/java/com/gstraders/creditmanager/
          mv styles.xml app/src/main/res/values/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GS-Traders-Credit-Manager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
